plugins {
    id 'com.gradleup.shadow' version '9.2.2'
    id 'me.modmuss50.mod-publish-plugin'
}

def moduleArtifactId = "${rootProject.projectArchiveBaseName}-neoforge"

base {
    archivesName = moduleArtifactId
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

loom {
    runs {
        configureEach {
            // NeoForge's @OnlyIn warning makes no sense for cross-platform mods
            vmArg('-Dneoforge.warnings.onlyin.hide=true')
        }
    }
}

configurations {
    common
    shadowCommon
    // Don't use shadow from the shadow plugin because we don't want IDEA to index this.
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common
}

dependencies {
    neoForge "net.neoforged:neoforge:${rootProject.neoForgeVersion}"

    common(project(path: ':common')) { transitive false }
    shadowCommon(project(path: ':common', configuration: 'transformProductionNeoForge')) { transitive false }

    // Nullable annotations.
    implementation 'com.google.code.findbugs:jsr305:3.0.2'
    implementation 'org.jetbrains:annotations:23.0.0'

    // Jankson
    localRuntime("blue.endless:jankson:${rootProject.janksonVersion}")
    forgeRuntimeLibrary(shadowCommon("blue.endless:jankson:${rootProject.janksonVersion}"))
}

processResources {
    inputs.property "version", project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand 'version': project.version
    }
}

shadowJar {
    dependsOn(jar)
    mainSpec.sourcePaths.clear()
    from(zipTree(jar.archiveFile))

    exclude 'fabric.mod.json'
    exclude 'architectury.common.json'

    relocate 'blue.endless.jankson', "${rootProject.group}.shulkerboxtooltip.shadowed.blue.endless.jankson"

    configurations = [project.configurations.shadowCommon]
    archiveClassifier = null
}

jar {
    archiveClassifier = 'raw'
}

sourcesJar {
    def commonSources = project(':common').sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

// Include both common and neoforge documentation in the javadoc
def javadocProjects = [':neoforge', ':common']
javadoc {
    source = javadocProjects.collect { project(it).sourceSets.main.allJava }
    classpath = files(javadocProjects.collect { project(it).sourceSets.main.compileClasspath })

    exclude 'com/misterpemodder/shulkerboxtooltip/impl/**'
    exclude 'com/misterpemodder/shulkerboxtooltip/mixin/**'
    exclude 'com/misterpemodder/shulkerboxtooltip/*.java'
    exclude 'com/misterpemodder/shulkerboxtooltip/neoforge/*.java'
}

task javadocJar(type: Jar, dependsOn: javadoc) {
    archiveClassifier.set('javadoc')
    from javadoc.destinationDir
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

publishing {
    publications {
        mavenNeoForge(MavenPublication) {
            groupId = project.group
            artifactId = moduleArtifactId
            version = project.version

            artifact(shadowJar) {
                builtBy shadowJar
            }

            artifact(sourcesJar) {
                builtBy sourcesJar
            }

            artifact(javadocJar) {
                builtBy javadocJar
            }

            pom rootProject.ext.makePom(project)
        }
    }
}

signing {
    def signingKey = findProperty('signingKey')
    def signingPassword = findProperty('signingPassword')
    if (signingKey && signingPassword) {
        useInMemoryPgpKeys(signingKey, signingPassword)
        sign publishing.publications.mavenNeoForge
    } else {
        println("${project.name}: skipping jar signing")
    }
}

publishMods {
    file = shadowJar.archiveFile
    displayName = "[NeoForge $project.mcVersionFull] v${project.version}"
    version = "${project.version}-neoforge"
    type = me.modmuss50.mpp.ReleaseType.of(rootProject.getReleaseType())
    changelog = rootProject.parseChangelog('changelog.txt')
    modLoaders.add('neoforge')
    dryRun = project.projectBaseVersion.contains('SNAPSHOT')

    if (System.getenv('CURSE_API_KEY') && project.hasProperty('curseProjectId')) {
        curseforge {
            accessToken = providers.environmentVariable('CURSE_API_KEY')
            projectId = project.curseProjectId
            minecraftVersions.addAll(hostGameVersions.split(','))
            javaVersions.add(JavaVersion.VERSION_25)
            client = true
            server = true
        }
    }

    if (System.getenv('MODRINTH_TOKEN') && project.hasProperty('modrinthProjectId')) {
        modrinth {
            accessToken = providers.environmentVariable('MODRINTH_TOKEN')
            projectId = project.modrinthProjectId
            minecraftVersions.addAll(hostGameVersions.split(','))
        }
    }
}
