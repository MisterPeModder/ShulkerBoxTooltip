plugins {
    id 'com.gradleup.shadow' version '9.2.2'
    id 'me.modmuss50.mod-publish-plugin'
}

def moduleArtifactId = "${rootProject.projectArchiveBaseName}-fabric"

base {
    archivesName = moduleArtifactId
}

architectury {
    platformSetupLoomIde()
    fabric()
}

loom {
    accessWidenerPath = project(':common').loom.accessWidenerPath
}

configurations {
    common
    shadowCommon
    // Don't use shadow from the shadow plugin because we don't want IDEA to index this.
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
}

dependencies {
    implementation "net.fabricmc:fabric-loader:${rootProject.fabricLoaderVersion}"
    api("net.fabricmc.fabric-api:fabric-api:${rootProject.fabricApiVersion}") {
        exclude(module: 'fabric-api-deprecated')
    }

    // Mod Menu
    implementation("com.terraformersmc:modmenu:${rootProject.modMenuVersion}") {
        exclude(group: 'net.fabricmc.fabric-api')
    }

    common(project(path: ':common')) { transitive false }
    shadowCommon(project(path: ':common', configuration: 'transformProductionFabric')) { transitive false }

    // Nullable annotations.
    implementation 'com.google.code.findbugs:jsr305:3.0.2'
    implementation 'org.jetbrains:annotations:23.0.0'

    // Jankson
    implementation "blue.endless:jankson:${rootProject.janksonVersion}"
    shadowCommon "blue.endless:jankson:${rootProject.janksonVersion}"
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

shadowJar {
    dependsOn(jar)
    mainSpec.sourcePaths.clear()
    from(zipTree(jar.archiveFile))

    exclude 'architectury.common.json'

    relocate 'blue.endless.jankson', "${rootProject.group}.shulkerboxtooltip.shadowed.blue.endless.jankson"

    configurations = [project.configurations.shadowCommon]
    archiveClassifier = null
}

jar {
    archiveClassifier = 'raw'
}

configurations {
    apiElements {
        outgoing.artifacts.clear()
        outgoing.artifact(shadowJar)
    }
    runtimeElements {
        outgoing.artifacts.clear()
        outgoing.artifact(shadowJar)
    }
}

sourcesJar {
    def commonSources = project(':common').sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

// Include both common and fabric documentation in the javadoc
def javadocProjects = [':fabric', ':common']
javadoc {
    source = javadocProjects.collect { project(it).sourceSets.main.allJava }
    classpath = files(javadocProjects.collect { project(it).sourceSets.main.compileClasspath })

    exclude 'com/misterpemodder/shulkerboxtooltip/impl/**'
    exclude 'com/misterpemodder/shulkerboxtooltip/mixin/**'
    exclude 'com/misterpemodder/shulkerboxtooltip/*.java'
    exclude 'com/misterpemodder/shulkerboxtooltip/fabric/*.java'
}

task javadocJar(type: Jar, dependsOn: javadoc) {
    archiveClassifier.set('javadoc')
    from javadoc.destinationDir
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

publishing {
    publications {
        mavenFabric(MavenPublication) {
            groupId = project.group
            artifactId = moduleArtifactId
            version = project.version

            artifact(shadowJar) {
                builtBy shadowJar
            }

            artifact(sourcesJar) {
                builtBy sourcesJar
            }

            artifact(javadocJar) {
                builtBy javadocJar
            }

            pom rootProject.ext.makePom(project)
        }
    }
}

signing {
    def signingKey = findProperty('signingKey')
    def signingPassword = findProperty('signingPassword')
    if (signingKey && signingPassword) {
        useInMemoryPgpKeys(signingKey, signingPassword)
        sign publishing.publications.mavenFabric
    } else {
        println("${project.name}: skipping jar signing")
    }
}

publishMods {
    file = shadowJar.archiveFile
    displayName = "[Fabric $project.mcVersionFull] v${project.version}"
    version = "${project.version}-fabric"
    type = me.modmuss50.mpp.ReleaseType.of(rootProject.getReleaseType())
    changelog = rootProject.parseChangelog('changelog.txt')
    modLoaders.add('fabric')
    dryRun = project.projectBaseVersion.contains('SNAPSHOT')

    if (System.getenv('CURSE_API_KEY') && project.hasProperty('curseProjectId')) {
        curseforge {
            accessToken = providers.environmentVariable('CURSE_API_KEY')
            projectId = project.curseProjectId
            minecraftVersions.addAll(hostGameVersions.split(','))
            javaVersions.add(JavaVersion.VERSION_25)
            client = true
            server = true
            requires('fabric-api')
            optional('modmenu')
        }
    }

    if (System.getenv('MODRINTH_TOKEN') && project.hasProperty('modrinthProjectId')) {
        modrinth {
            accessToken = providers.environmentVariable('MODRINTH_TOKEN')
            projectId = project.modrinthProjectId
            minecraftVersions.addAll(hostGameVersions.split(','))
            requires('fabric-api')
            optional('modmenu')
        }
    }
}
